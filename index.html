<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080811"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest"><title>ARISE // Life OS</title>
<style>
:root{--bg:#080811;--card:#111321;--card2:#171a2c;--line:#292d48;--txt:#f2efff;--muted:#9294b3;--pink:#ff63b5;--violet:#a78bfa;--green:#86f7b5;--gold:#ffd479;--red:#ff7185;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--txt);background:radial-gradient(ellipse at 15% 0%,#29132e 0,transparent 35%),radial-gradient(ellipse at 100% 30%,#101e3b 0,transparent 32%),var(--bg);min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1440px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;padding:12px 0 18px;border-bottom:1px solid var(--line)}.logo{font-weight:1000;letter-spacing:6px;font-size:27px;background:linear-gradient(90deg,var(--pink),var(--violet),var(--green));background-clip:text;color:transparent}.sub{font-size:9px;letter-spacing:2px;color:var(--muted);margin-top:4px}.live{font-size:10px;color:var(--green);text-align:right}.layout{display:grid;grid-template-columns:220px 1fr;gap:18px;margin-top:18px}.side{background:#0d0f1beF;border:1px solid var(--line);border-radius:16px;padding:10px;height:max-content;position:sticky;top:12px}.nav{width:100%;border:0;color:var(--muted);background:none;text-align:left;padding:12px;border-radius:9px;margin:2px 0}.nav.active,.nav:hover{background:linear-gradient(100deg,#38203d,#20223b);color:#fff;box-shadow:inset 3px 0 var(--pink)}.nav small{display:block;color:#6f718d;font-size:9px;margin:8px 10px 3px;letter-spacing:2px}.main{min-width:0}.hero{border:1px solid #53345d;border-radius:18px;padding:24px;background:linear-gradient(115deg,#28152c,#15182c 65%,#10231d);position:relative;overflow:hidden}.hero:after{content:"ARISE";position:absolute;right:10px;bottom:-40px;font-size:110px;font-weight:1000;color:#ffffff08;letter-spacing:8px}.kicker{font-size:10px;color:var(--pink);letter-spacing:3px}.hero h1{font-size:clamp(27px,4vw,44px);margin:12px 0 8px;line-height:1.05}.hero p{color:#b9b4d1;max-width:570px;font-size:13px;line-height:1.7}.herofoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;font-size:10px;color:var(--green);letter-spacing:1px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:13px}.stat,.panel{background:linear-gradient(145deg,#151727,#0e101c);border:1px solid var(--line);border-radius:14px;padding:15px}.stat label{font-size:9px;color:var(--muted);letter-spacing:1px}.stat strong{display:block;font-size:26px;margin-top:7px;color:var(--green)}.panel{margin-top:13px}.panel h2{font-size:11px;letter-spacing:2px;color:var(--pink);margin:0 0 13px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #25283c}.row:last-child{border:0}.muted,.tiny{color:var(--muted)}.tiny{font-size:10px}.btn{border:1px solid #57406a;background:#21182b;color:#f3b9df;padding:9px 12px;border-radius:8px}.primary{background:linear-gradient(100deg,var(--pink),var(--violet));color:#170e20;border:0;font-weight:800}.green{color:var(--green)}.danger{color:var(--red)}.actions{display:flex;gap:6px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;margin:8px 0}.field label{font-size:9px;letter-spacing:1px;color:var(--muted)}.field input,.field select,.field textarea,input.search{background:#090b15;border:1px solid var(--line);color:var(--txt);padding:11px;border-radius:8px;width:100%;min-width:0}.field textarea{min-height:80px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.empty{text-align:center;padding:22px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:12px}.pill{font-size:9px;border:1px solid #57406a;color:#f3b9df;padding:4px 7px;border-radius:99px}.bar{height:6px;background:#2b2d42;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--green))}.bottomnav{display:none}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#07110c;padding:11px 16px;border-radius:9px;display:none;z-index:10;font-weight:800;font-size:12px}.mission{background:linear-gradient(100deg,#25172e,#151b2b);border:1px solid #51355e;border-radius:12px;padding:14px;margin:8px 0}
@media(max-width:760px){.app{padding:12px 12px 88px}.layout{display:block;margin-top:12px}.side{display:none}.top{padding-bottom:12px}.logo{font-size:23px}.hero{padding:20px}.hero h1{font-size:30px}.hero:after{font-size:65px;bottom:-18px}.grid{grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:12px}.stat strong{font-size:23px}.split{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:8;background:#0c0d19f5;border-top:1px solid var(--line);padding:7px 3px calc(7px + env(safe-area-inset-bottom));justify-content:space-around;backdrop-filter:blur(16px)}.bottomnav button{border:0;background:none;color:var(--muted);font-size:9px;padding:6px 3px;display:flex;flex-direction:column;gap:4px;align-items:center}.bottomnav button.active{color:var(--pink)}.bottomnav b{font-size:18px}.herofoot{font-size:9px}.pagehead{display:flex;justify-content:space-between;align-items:end;margin:8px 0 12px}.pagehead h1{font-size:23px;margin:4px 0}.date{font-size:9px;color:var(--muted)}}
</style></head><body><div class="app">
<header class="top"><div><div class="logo">ARISE</div><div class="sub">// YOUR LIFE. YOUR RULES. YOUR SYSTEM.</div></div><div class="live">● SYSTEM ONLINE<br><span id="clock" class="tiny"></span></div></header>
<div class="layout"><aside class="side" id="side"></aside><main class="main" id="main"></main></div><nav class="bottomnav" id="bottom"></nav></div><div class="toast" id="toast"></div>
<script>
const K='arise2data';const emptyDB={tasks:[],habits:[],goals:[],journal:[],trades:[],metrics:[],activities:[],reminders:[]};let db;try{db={...emptyDB,...JSON.parse(localStorage.getItem(K)||'{}')}}catch{db={...emptyDB}}let page='home',watch=null,watchStart=0,watchMeters=0,watchPoints=[];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);const today=()=>new Date().toISOString().slice(0,10);const save=()=>localStorage.setItem(K,JSON.stringify(db));const toast=s=>{let t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2100)};const navs=[['home','⌂','Command'],['activity','⌁','Activity'],['habits','◈','Habits'],['goals','◎','Missions'],['journal','▧','Life log'],['trading','⌁','Trading'],['body','♧','Body'],['money','$','Money'],['backup','⇅','Data']];
function nav(){let buttons=navs.map(([p,ic,n])=>`<button class="nav ${page===p?'active':''}" data-p="${p}">${ic} &nbsp; ${n}</button>`);$('#side').innerHTML='<small>PERSONAL COMMAND</small>'+buttons.join('')+'<small>SESSION // PRIVATE LOCAL</small>';$('#bottom').innerHTML=navs.slice(0,5).concat(navs.slice(5,7)).map(([p,ic,n])=>`<button data-p="${p}" class="${page===p?'active':''}"><b>${ic}</b>${n}</button>`).join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p))}
function go(p){page=p;render()}
function head(tag,title){return `<div class="pagehead"><div><div class="kicker">// ${tag}</div><h1>${title}</h1></div><div class="date">${today()}</div></div>`}
function stat(l,v){return `<div class="stat"><label>${l}</label><strong>${v}</strong></div>`}
function panel(t,c){return `<section class="panel"><h2>${t}</h2>${c}</section>`}
function empty(s){return `<div class="empty">${s}</div>`}
function formField(label,name,placeholder='',type='text'){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" placeholder="${placeholder}"></div>`}
function render(){nav();let m=$('#main');
if(page==='home'){let open=db.tasks.filter(t=>!t.done).length,done=db.tasks.filter(t=>t.done).length;
m.innerHTML=`<section class="hero"><div class="kicker">ARISE // PERSONAL COMMAND CENTER</div><h1>Own your day.<br><span style="color:var(--pink)">Rewrite your story.</span></h1><p>Your life is not a checklist. It's a system in motion. Capture the real world, build momentum, and review the evidence.</p><div class="herofoot"><span>▰ ${new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</span><span>LEVEL ${Math.floor((done+db.activities.length+db.journal.length)/5)+1} // OPERATOR</span></div></section><div class="grid">${stat('OPEN TASKS',open)}${stat('HABITS',db.habits.length)}${stat('LIFE LOGS',db.journal.length)}${stat('TRADES LOGGED',db.trades.length)}</div><div class="split">${panel('⚡ QUICK CAPTURE',`<div class="actions"><button class="btn primary" onclick="go('activity')">Start activity</button><button class="btn" onclick="go('journal')">Log a moment</button><button class="btn" onclick="go('body')">Body check-in</button></div>`)}${panel('◈ TODAY’S HABITS',habitRows())}</div>${panel('🎯 ACTIVE MISSIONS',db.goals.filter(g=>!g.done).slice(0,3).map(goalRow).join('')||empty('Create your first mission.'))}${panel('⌁ RECENT SIGNALS',db.activities.slice(-3).reverse().map(activityRow).join('')||empty('No activity captured yet. Start a walk or run.'))}`}
else if(page==='activity'){m.innerHTML=head('REAL WORLD TRACKING','Activity lab')+panel('GPS SESSION',`<p class="tiny">Track a walk or run using your phone GPS while this page stays open and location permission is enabled.</p><div class="grid">${stat('DISTANCE', (watchMeters/1000).toFixed(2)+' km')}${stat('ELAPSED',watch?Math.floor((Date.now()-watchStart)/60000)+' min':'0 min')}</div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="startGPS()">Start GPS tracking</button><button class="btn" onclick="stopGPS()">Stop & save</button></div><p class="tiny" id="gpsmsg">GPS idle. On iPhone/Android, allow location access.</p>`)+panel('QUICK ACTIVITY',`<div class="actions">${['Walking','Running','Gym','Cycling','Badminton','Sports','Study','Reading','Work','Other'].map(x=>`<button class="btn" onclick="quickActivity('${x}')">${x}</button>`).join('')}</div>`)+panel('ACTIVITY HISTORY',db.activities.slice().reverse().map(activityRow).join('')||empty('No activities logged.'))}
else if(page==='habits'){m.innerHTML=head('CONSISTENCY ENGINE','Habit builder')+panel('NEW HABIT',`<form id="hf">${formField('HABIT NAME','name','e.g. 30 min study')}<div class="field"><label>FREQUENCY</label><select name="freq"><option>Daily</option><option>Weekdays</option><option>Weekly</option></select></div><button class="btn primary">Deploy habit +</button></form>`)+panel('DAILY CHECK-IN',habitRows(true))}
else if(page==='goals'){m.innerHTML=head('MISSION CONTROL','Goals & missions')+panel('CREATE MISSION',`<form id="gf">${formField('MISSION','title','e.g. Clear semester backlog')}<div class="formgrid">${formField('DEADLINE','date','','date')}<div class="field"><label>HORIZON</label><select name="horizon"><option>7 days</option><option>30 days</option><option>90 days</option><option>1 year</option></select></div></div>${formField('WHY THIS MATTERS','why','Reason')}<button class="btn primary">Create mission +</button></form>`)+panel('ACTIVE MISSIONS',db.goals.map(goalRow).join('')||empty('No missions yet.'))}
else if(page==='journal'){m.innerHTML=head('MEMORY CORE','Life timeline')+panel('CAPTURE A MOMENT',`<form id="jf">${formField('TITLE','title','What happened?')}<div class="formgrid"><div class="field"><label>TYPE</label><select name="type"><option>Win</option><option>Setback</option><option>Problem</option><option>Lesson</option><option>Memory</option></select></div>${formField('DATE','date','','date')}</div><div class="field"><label>DETAILS</label><textarea name="note" placeholder="Record the context, thoughts and outcome."></textarea></div><button class="btn primary">Save to memory core</button></form>`)+panel('TIMELINE',db.journal.slice().reverse().map(journalRow).join('')||empty('Your timeline is waiting.'))}
else if(page==='trading'){let closed=db.trades.filter(t=>t.pnl!==null),net=closed.reduce((a,t)=>a+t.pnl,0),wins=closed.filter(t=>t.pnl>0).length;m.innerHTML=head('MARKET DESK','Trading terminal')+`<div class="grid">${stat('TRADES',db.trades.length)}${stat('WIN RATE',closed.length?Math.round(wins/closed.length*100)+'%':'—')}${stat('NET P&L',net.toFixed(2))}${stat('OPEN',db.trades.filter(t=>t.pnl===null).length)}</div>`+panel('LOG A POSITION',`<form id="tf"><div class="formgrid">${formField('SYMBOL','symbol','NIFTY / BTC / INFY')}<div class="field"><label>MARKET</label><select name="market"><option>Equity</option><option>Options</option><option>Futures</option><option>Forex</option><option>Crypto</option></select></div><div class="field"><label>SIDE</label><select name="side"><option>Long</option><option>Short</option></select></div>${formField('QUANTITY','qty','1','number')}${formField('ENTRY','entry','0','number')}${formField('EXIT (OPTIONAL)','exit','0','number')}</div>${formField('SETUP / LESSON','note','Why did you take this trade?')}<button class="btn primary">Save trade</button></form>`)+panel('TRADE HISTORY',db.trades.slice().reverse().map(t=>`<div class="row"><div><b>${esc(t.symbol)}</b><div class="tiny">${t.market} · ${t.side} · ${t.date}</div><div class="tiny">Entry ${t.entry} / Exit ${t.exit??'Open'} · ${esc(t.note)}</div></div><b class="${t.pnl>0?'green':t.pnl<0?'danger':''}">${t.pnl===null?'OPEN':t.pnl.toFixed(2)}</b></div>`).join('')||empty('No trades recorded.'))}
else if(page==='body'){m.innerHTML=head('BODY TELEMETRY','Body & health metrics')+panel('LOG A MEASUREMENT',`<form id="bf"><div class="formgrid"><div class="field"><label>METRIC</label><select name="metric"><option>Weight (kg)</option><option>Height (cm)</option><option>Waist (cm)</option><option>Sleep (hours)</option><option>Water (glasses)</option><option>Resting heart rate (bpm)</option><option>Steps</option><option>Other</option></select></div>${formField('VALUE','value','e.g. 78')} ${formField('DATE','date','','date')}</div><button class="btn primary">Record measurement</button></form><p class="tiny">Height is measured periodically, not continuously. Health readings and steps need device/health-platform permissions or manual import.</p>`)+panel('MEASUREMENT HISTORY',db.metrics.slice().reverse().map(x=>`<div class="row"><span>${esc(x.metric)}<div class="tiny">${x.date}</div></span><b>${esc(x.value)}</b></div>`).join('')||empty('No measurements yet.'))}
else if(page==='money'){m.innerHTML=head('FINANCIAL CONTROL','Money dashboard')+panel('ADD CASH FLOW',`<form id="mf"><div class="formgrid"><div class="field"><label>TYPE</label><select name="type"><option>Income</option><option>Expense</option><option>Savings</option></select></div>${formField('AMOUNT (₹)','amount','0','number')}${formField('CATEGORY','category','Food, travel, fees...')}${formField('DATE','date','','date')}</div><button class="btn primary">Record transaction</button></form>`)+panel('CASH FLOW',db.money?.slice().reverse().map(x=>`<div class="row"><span>${esc(x.category)} · ${x.date}<div class="tiny">${x.type}</div></span><b>₹${x.amount}</b></div>`).join('')||empty('Start tracking your money.'))}
else if(page==='backup'){m.innerHTML=head('DATA CORE','Backup & transfer')+panel('EXPORT YOUR LIFE DATA',`<p class="tiny">Download all ARISE records as a JSON backup. Transfer this file between your phone and MacBook to move your records.</p><button class="btn primary" onclick="exportData()">Download backup</button>`)+panel('RESTORE BACKUP',`<input id="file" type="file" accept=".json"><button class="btn" style="margin-top:10px" onclick="importData()">Import backup</button>`)+panel('DEVICE SYNC REALITY',`<p class="tiny">This build stores data on each device. It does not silently sync. Cross-device cloud sync requires a secure sync account/server, which is not included in this local-first free template.</p>`)}
bindForms();save()}
function habitRows(withCreate=false){return db.habits.map(h=>`<div class="row"><span>${esc(h.name)}<div class="tiny">${h.freq} · ${h.logs?.length||0} check-ins</div></span><button class="btn ${h.logs?.includes(today())?'primary':''}" onclick="checkHabit('${h.id}')">${h.logs?.includes(today())?'✓ Done':'Check in'}</button></div>`).join('')||empty('Add a habit you want to make automatic.')}
function goalRow(g){return `<div class="row"><div style="flex:1"><b>${esc(g.title)}</b><div class="tiny">${g.horizon} · ${g.date||'No deadline'} · ${esc(g.why)}</div><div class="bar"><i style="width:${g.progress||0}%"></i></div></div><div class="actions"><button class="btn" onclick="progress('${g.id}')">+10%</button><button class="btn" onclick="del('goals','${g.id}')">×</button></div></div>`}
function activityRow(a){return `<div class="row"><div><b>${esc(a.type)}</b><div class="tiny">${a.date} · ${a.duration||'Quick log'} ${a.distance?'· '+a.distance.toFixed(2)+' km':''}</div></div><span class="pill">RECORDED</span></div>`}
function journalRow(j){return `<div class="row"><div><span class="pill">${esc(j.type)}</span> <b>${esc(j.title)}</b><div class="tiny">${j.date} · ${esc(j.note)}</div></div><button class="btn" onclick="del('journal','${j.id}')">×</button></div>`}
function bindForms(){let f=$('#hf');if(f)f.onsubmit=e=>{e.preventDefault();let d=new FormData(f);db.habits.push({id:id(),name:d.get('name'),freq:d.get('freq'),logs:[]});save();render();toast('Habit deployed')};f=$('#gf');if(f)f.onsubmit=e=>{e.preventDefault();let d=new FormData(f);db.goals.push({id:id(),title:d.get('title'),date:d.get('date'),horizon:d.get('horizon'),why:d.get('why'),progress:0});save();render();toast('Mission created')};f=$('#jf');if(f)f.onsubmit=e=>{e.preventDefault();let d=new FormData(f);db.journal.push({id:id(),title:d.get('title'),type:d.get('type'),date:d.get('date')||today(),note:d.get('note')});save();render();toast('Memory saved')};f=$('#tf');if(f)f.onsubmit=e=>{e.preventDefault();let d=new FormData(f),entry=+d.get('entry'),exit=d.get('exit')?+d.get('exit'):null,qty=+d.get('qty')||1,side=d.get('side');db.trades.push({id:id(),symbol:d.get('symbol'),market:d.get('market'),side,entry,exit,qty,pnl:exit===null?null:((side==='Long'?exit-entry:entry-exit)*qty),note:d.get('note'),date:today()});save();render();toast('Trade logged')};f=$('#bf');if(f)f.onsubmit=e=>{e.preventDefault();let d=new FormData(f);db.metrics.push({id:id(),metric:d.get('metric'),value:d.get('value'),date:d.get('date')||today()});save();render();toast('Measurement recorded')};f=$('#mf');if(f)f.onsubmit=e=>{e.preventDefault();let d=new FormData(f);db.money=db.money||[];db.money.push({id:id(),type:d.get('type'),amount:d.get('amount'),category:d.get('category'),date:d.get('date')||today()});save();render();toast('Cash flow saved')}}
function checkHabit(i){let h=db.habits.find(x=>x.id===i);h.logs=h.logs||[];h.logs.includes(today())?h.logs=h.logs.filter(x=>x!==today()):h.logs.push(today());save();render()}
function progress(i){let g=db.goals.find(x=>x.id===i);g.progress=Math.min(100,(g.progress||0)+10);save();render()}
function del(k,i){if(confirm('Delete this record?')){db[k]=db[k].filter(x=>x.id!==i);save();render()}}
function quickActivity(type){db.activities.push({id:id(),type,date:today()});save();render();toast(type+' logged')}
function startGPS(){if(!navigator.geolocation){toast('GPS not supported');return}if(watch!==null)return toast('Tracking already active');watchStart=Date.now();watchMeters=0;watchPoints=[];watch=navigator.geolocation.watchPosition(pos=>{let c=pos.coords;if(watchPoints.length){let a=watchPoints.at(-1);watchMeters+=dist(a.lat,a.lon,c.latitude,c.longitude)}watchPoints.push({lat:c.latitude,lon:c.longitude});$('#gpsmsg').textContent='GPS active · accuracy '+Math.round(c.accuracy)+'m · keep this screen open';let st=$('.grid');if(st)st.innerHTML=stat('DISTANCE',(watchMeters/1000).toFixed(2)+' km')+stat('ELAPSED',Math.floor((Date.now()-watchStart)/60000)+' min')},e=>$('#gpsmsg').textContent='GPS error: '+e.message,{enableHighAccuracy:true,maximumAge:3000,timeout:15000});toast('GPS tracking started')}
function dist(a,b,c,d){let R=6371,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b),q=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function stopGPS(){if(watch===null)return toast('No GPS session running');navigator.geolocation.clearWatch(watch);watch=null;db.activities.push({id:id(),type:'GPS walk/run',date:today(),duration:Math.round((Date.now()-watchStart)/60000)+' min',distance:watchMeters/1000});save();render();toast('Activity saved')}
function exportData(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='ARISE-backup-'+today()+'.json';a.click();URL.revokeObjectURL(u)}
function importData(){let f=$('#file').files[0];if(!f)return toast('Choose a backup file');let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!confirm('Replace current data with this backup?'))return;db={...emptyDB,...x};save();render();toast('Backup restored')}catch{toast('Invalid backup')}};r.readAsText(f)}
setInterval(()=>$('#clock').textContent=new Date().toLocaleTimeString(),1000);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
